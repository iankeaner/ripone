<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 RIPONE.COM — ???</title>
<style>
  * { box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
  }

  .hallway-img{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  .dim{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.75) 100%);
    z-index:1;
    pointer-events:none;
  }

  body, body *{ cursor:none !important; }

  #lightsOverlay{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at var(--mx,50%) var(--my,50%),
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) var(--r-inner,55px),
      rgba(4,2,8,0.55) var(--r-mid,120px),
      rgba(2,1,5,0.88) var(--r-outer,220px),
      rgba(1,0,3,0.98) var(--r-far,340px)
    );
    z-index:9998;
    pointer-events:none;
    transition: background 90ms linear;
  }

  #candleCursor{
    position:fixed;
    top:50%; left:50%;
    z-index:9999;
    pointer-events:none;
    transform:translate(-50%,-72%);
  }
  #candleCursor.mode-arrow{
    transform:translate(-50%,-50%);
  }

  .cursor-glyph{
    font-size:30px;
    line-height:1;
    filter:
      drop-shadow(0 0 6px #ffcf7a)
      drop-shadow(0 0 16px #ff9d2f)
      drop-shadow(0 0 34px #ff7518);
    animation: candleFlicker 2.4s infinite;
    transform-origin: 50% 85%;
  }
  .cursor-glyph.cursor-arrow{
    animation: arrowGlow 1.5s ease-in-out infinite;
  }

  @keyframes candleFlicker{
    0%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    4%{ transform:rotate(-3deg) scale(0.96); filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 10px #ff9d2f) drop-shadow(0 0 20px #ff7518); }
    8%{ transform:rotate(2deg) scale(1.04); filter: drop-shadow(0 0 8px #ffcf7a) drop-shadow(0 0 20px #ff9d2f) drop-shadow(0 0 44px #ff7518); }
    13%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    30%{ transform:rotate(-2deg) scale(0.98); filter: drop-shadow(0 0 5px #ffcf7a) drop-shadow(0 0 13px #ff9d2f) drop-shadow(0 0 26px #ff7518); }
    34%{ transform:rotate(1deg) scale(1.06); filter: drop-shadow(0 0 9px #ffcf7a) drop-shadow(0 0 24px #ff9d2f) drop-shadow(0 0 50px #ff7518); }
    38%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    55%{ transform:rotate(3deg) scale(0.94); filter: drop-shadow(0 0 3px #ffcf7a) drop-shadow(0 0 8px #ff9d2f) drop-shadow(0 0 16px #ff7518); }
    60%{ transform:rotate(-1deg) scale(1.03); filter: drop-shadow(0 0 7px #ffcf7a) drop-shadow(0 0 18px #ff9d2f) drop-shadow(0 0 38px #ff7518); }
    65%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    80%{ transform:rotate(-2deg) scale(1.02); filter: drop-shadow(0 0 8px #ffcf7a) drop-shadow(0 0 20px #ff9d2f) drop-shadow(0 0 42px #ff7518); }
    85%{ transform:rotate(2deg) scale(0.95); filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 10px #ff9d2f) drop-shadow(0 0 20px #ff7518); }
    100%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
  }
  @keyframes arrowGlow{
    0%,100%{ filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); transform:scale(1); }
    50%{ filter: drop-shadow(0 0 10px #ffcf7a) drop-shadow(0 0 26px #ff9d2f) drop-shadow(0 0 50px #ff7518); transform:scale(1.1); }
  }

  /* the spiral staircase itself, leading further up */
  #staircaseUp{
    position:fixed;
    left:15vw;
    top:15vh;
    width:65vw;
    height:75vh;
    z-index:2;
  }

  #exitZone{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:5;
  }

  .hint{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:4;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    color:#c9b8e8;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    transition: opacity 0.3s ease;
    pointer-events:none;
    text-shadow: 0 0 6px rgba(176,38,255,0.6);
  }
  #exitZone:hover ~ .hint,
  .hint.show{
    opacity:0.85;
  }

  /* ===== hotbar (shows while the lights are off) ===== */
  #hotbar{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:none;
    gap:7px;
    z-index:10000;
    padding:7px;
    background: rgba(10,6,4,0.55);
    border-radius:8px;
    box-shadow: 0 0 18px rgba(0,0,0,0.6);
    pointer-events:auto;
  }
  body.lights-off #hotbar{ display:flex; }
  .hotbar-slot{
    width:44px;
    height:44px;
    border:2px solid rgba(201,184,232,0.35);
    border-radius:6px;
    background: linear-gradient(160deg, rgba(50,36,26,0.9), rgba(14,9,7,0.92));
    position:relative;
  }

<div id="lightsOverlay"></div>
<div id="candleCursor">
  <div class="cursor-glyph" id="cursorGlyph">🕯️</div>
</div>

<div id="staircaseUp"></div>
<div id="exitZone"></div>
<div class="hint" id="exitHint">↓ leave ↓</div>

<script>
  (function(){
    var body = document.body;
    var candle = document.getElementById('candleCursor');
    var glyph = document.getElementById('cursorGlyph');
    var exitZone = document.getElementById('exitZone');
    var exitHint = document.getElementById('exitHint');

    function moveCandle(x, y){
      body.style.setProperty('--mx', x + 'px');
      body.style.setProperty('--my', y + 'px');
      candle.style.left = x + 'px';
      candle.style.top = y + 'px';
    }
    document.addEventListener('mousemove', function(e){ moveCandle(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function(e){
      if (e.touches && e.touches[0]) moveCandle(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function jitterFlicker(){
      var innerJ = 45 + Math.random() * 22;
      var midJ = 100 + Math.random() * 45;
      var outerJ = 190 + Math.random() * 65;
      var farJ = 310 + Math.random() * 70;
      body.style.setProperty('--r-inner', innerJ + 'px');
      body.style.setProperty('--r-mid', midJ + 'px');
      body.style.setProperty('--r-outer', outerJ + 'px');
      body.style.setProperty('--r-far', farJ + 'px');
    }
    setInterval(jitterFlicker, 160);
    jitterFlicker();

    exitZone.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '⬇️';
      glyph.classList.add('cursor-arrow');
      exitHint.classList.add('show');
    });
    exitZone.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
      exitHint.classList.remove('show');
    });
    exitZone.addEventListener('click', function(){
      window.location.href = 'attic-halloween.html';
    });

    var staircaseUp = document.getElementById('staircaseUp');
    if (staircaseUp) {
      staircaseUp.addEventListener('mouseenter', function(){
        candle.classList.add('mode-arrow');
        glyph.textContent = '⬆️';
        glyph.classList.add('cursor-arrow');
      });
      staircaseUp.addEventListener('mouseleave', function(){
        candle.classList.remove('mode-arrow');
        glyph.textContent = '🕯️';
        glyph.classList.remove('cursor-arrow');
      });
      staircaseUp.addEventListener('click', function(){
        window.location.href = 'keepsakes-halloween.html';
      });
    }

    // --- keep the soundtrack going in the background across this page too ---
    var PLAYLIST = ['audio/halloween-track-1.mp3', 'audio/halloween-track-2.mp3', 'audio/halloween-track-3.mp3'];
    var TRACK_DURATIONS = [238.0, 98.0, 101.1];
    var LAUGH_DURATION = 5.7;
    var trackAudio = new Audio();
    var laughAudio = new Audio('audio/spooky-laugh.mp3');
    var playlistIndex = 0;
    var soundtrackActive = true;
    var resumeListenersArmed = false;

    function setSegment(kind, idx, offsetSeconds){
      offsetSeconds = offsetSeconds || 0;
      try {
        localStorage.setItem('riponeSegmentKind', kind);
        localStorage.setItem('riponeSegmentIndex', String(idx));
        localStorage.setItem('riponeSegmentStartedAt', String(Date.now() - offsetSeconds * 1000));
      } catch(e){}
    }
    function resolvePlaybackPosition(){
      var kind = 'track', idx = 0, startedAt = 0;
      try {
        kind = localStorage.getItem('riponeSegmentKind') || 'track';
        idx = parseInt(localStorage.getItem('riponeSegmentIndex') || '0', 10) || 0;
        startedAt = parseInt(localStorage.getItem('riponeSegmentStartedAt') || '0', 10) || 0;
      } catch(e){}
      var elapsed = startedAt ? (Date.now() - startedAt) / 1000 : 0;
      if (elapsed < 0) elapsed = 0;
      if (kind === 'laugh') {
        if (elapsed < LAUGH_DURATION) return { kind:'laugh', time:elapsed };
        elapsed -= LAUGH_DURATION;
        idx = 0;
      }
      var guard = 0;
      while (elapsed >= TRACK_DURATIONS[idx % TRACK_DURATIONS.length] && guard < 200) {
        elapsed -= TRACK_DURATIONS[idx % TRACK_DURATIONS.length];
        idx += 1;
        guard++;
      }
      return { kind:'track', index: idx % PLAYLIST.length, time: elapsed };
    }
    function armClickToResume(){
      if (resumeListenersArmed) return;
      resumeListenersArmed = true;
      function tryResume(){
        document.removeEventListener('click', tryResume);
        document.removeEventListener('touchstart', tryResume);
        document.removeEventListener('keydown', tryResume);
        resumeListenersArmed = false;
        if (!soundtrackActive) return;
        var pos = resolvePlaybackPosition();
        if (pos.kind === 'laugh') {
          laughAudio.currentTime = pos.time;
          laughAudio.play().catch(function(){ armClickToResume(); });
        } else {
          playlistIndex = pos.index + 1;
          trackAudio.src = PLAYLIST[pos.index];
          trackAudio.currentTime = pos.time;
          setSegment('track', pos.index, pos.time);
          trackAudio.play().catch(function(){ armClickToResume(); });
        }
      }
      document.addEventListener('click', tryResume, { once:true });
      document.addEventListener('touchstart', tryResume, { once:true, passive:true });
      document.addEventListener('keydown', tryResume, { once:true });
    }
    function playNextTrack(){
      if (!soundtrackActive) return;
      var idx = playlistIndex % PLAYLIST.length;
      trackAudio.src = PLAYLIST[idx];
      trackAudio.currentTime = 0;
      setSegment('track', idx, 0);
      playlistIndex = idx + 1;
      trackAudio.play().catch(function(){ armClickToResume(); });
    }
    trackAudio.addEventListener('ended', function(){ if (soundtrackActive) playNextTrack(); });
    laughAudio.addEventListener('ended', function(){ if (soundtrackActive) playNextTrack(); });

    var pos = resolvePlaybackPosition();
    if (pos.kind === 'laugh') {
      playlistIndex = 0;
      setSegment('laugh', 0, pos.time);
      laughAudio.currentTime = pos.time;
      laughAudio.play().catch(function(){ armClickToResume(); });
    } else {
      playlistIndex = pos.index + 1;
      trackAudio.src = PLAYLIST[pos.index];
      trackAudio.currentTime = pos.time;
      setSegment('track', pos.index, pos.time);
      trackAudio.play().catch(function(){ armClickToResume(); });
    }

    try { localStorage.setItem('riponeLightsOff', '1'); } catch(e){}
  })();
</script>

<div id="hotbar">
  <div class="hotbar-slot" data-slot="1"></div>
  <div class="hotbar-slot" data-slot="2"></div>
  <div class="hotbar-slot" data-slot="3"></div>
  <div class="hotbar-slot" data-slot="4"></div>
  <div class="hotbar-slot" data-slot="5"></div>
  <div class="hotbar-slot" data-slot="6"></div>
  <div class="hotbar-slot" data-slot="7"></div>
</div>
<script>
  (function(){
    document.body.classList.add('lights-off');
    var HOTBAR_KEY = 'riponeGameHotbar';
    var slots = Array.prototype.slice.call(document.querySelectorAll('#hotbar .hotbar-slot'));
    function loadHotbarState(){
      try {
        var raw = localStorage.getItem(HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function renderHotbar(){
      var state = loadHotbarState();
      slots.forEach(function(slot, i){
        var existing = slot.querySelector('.hotbar-item');
        if (existing) existing.remove();
        var item = state.items[i];
        var ITEM_ICON_CLASS = { ash: 'item-ash', stick: 'item-stick', paint: 'item-paint', eye: 'item-eye', potion: 'item-potion', key: 'item-key' };
        if (item && ITEM_ICON_CLASS[item]) {
          var el = document.createElement('div');
          el.className = 'hotbar-item ' + ITEM_ICON_CLASS[item];
          slot.appendChild(el);
        }
      });
    }
    renderHotbar();
    window.riponeRenderHotbar = renderHotbar;
    window.addEventListener('storage', function(e){
      if (e.key === HOTBAR_KEY) renderHotbar();
    });
  })();
</script>
