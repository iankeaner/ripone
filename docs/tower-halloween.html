<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 RIPONE.COM — ???</title>
<style>
  * { box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
  }

  /* full-bleed: the image stretches/covers the entire viewport (best on
     wide/laptop screens), rather than being letterboxed */
  .tower-img{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  /* base darkening, lighter than the candlelit pages since the moon is
     doing the illuminating here, not a localized candle glow */
  .dim{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at 58% 9%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.6) 100%);
    z-index:1;
    pointer-events:none;
  }

  /* the moon itself washes the whole room in a pale, flickering light —
     centered roughly where the moon sits in the image, not on the cursor */
  .moonlight{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    background: radial-gradient(circle at 58% 9%,
      rgba(226,236,255,0.6) 0%,
      rgba(210,224,255,0.32) 16%,
      rgba(180,200,240,0.16) 34%,
      rgba(140,165,215,0.06) 55%,
      rgba(0,0,0,0) 78%
    );
    mix-blend-mode: screen;
    animation: moonFlicker 7s ease-in-out infinite;
  }
  @keyframes moonFlicker{
    0%{ opacity:0.85; }
    12%{ opacity:0.62; }
    24%{ opacity:0.95; }
    36%{ opacity:0.7; }
    48%{ opacity:1; }
    60%{ opacity:0.78; }
    72%{ opacity:0.92; }
    84%{ opacity:0.68; }
    100%{ opacity:0.85; }
  }

  /* green mist rising from the cauldron. Its on-screen position is computed
     in JS from the cauldron's fixed location within the source image
     (see positionMist()), so it tracks the cauldron correctly under
     object-fit:cover no matter the viewport's aspect ratio. */
  .cauldron-mist{
    position:fixed;
    left:0;
    top:0;
    width:0;
    height:0;
    z-index:2;
    pointer-events:none;
  }
  .mist-puff{
    position:absolute;
    left:0; top:0;
    width:5.5vw;
    height:8vw;
    margin-left:-2.75vw;
    margin-top:-4vw;
    border-radius:50%;
    background: radial-gradient(circle, rgba(120,255,150,0.85) 0%, rgba(110,255,140,0.5) 45%, rgba(110,255,140,0) 78%);
    filter: blur(2px);
    mix-blend-mode: screen;
    opacity:0;
    animation: mistRise 6s ease-in infinite;
  }
  .mist-2{ animation-delay:2s; margin-left:-3.6vw; }
  .mist-3{ animation-delay:4s; margin-left:-1.6vw; }
  @keyframes mistRise{
    0%{ transform:translateY(0) scale(0.6); opacity:0; }
    15%{ opacity:0.85; }
    50%{ transform:translateY(-3.5vw) scale(1.15) translateX(0.5vw); opacity:0.6; }
    85%{ opacity:0.15; }
    100%{ transform:translateY(-7vw) scale(1.5) translateX(-0.5vw); opacity:0; }
  }

  body, body *{ cursor:none !important; }

  #candleCursor{
    position:fixed;
    top:50%; left:50%;
    z-index:9999;
    pointer-events:none;
    transform:translate(-50%,-72%);
  }
  #candleCursor.mode-arrow{
    transform:translate(-50%,-50%);
  }

  /* no candle glow here — the moon is the only light source on this page */
  .cursor-glyph{
    font-size:30px;
    line-height:1;
    animation: cursorSway 2.6s ease-in-out infinite;
    transform-origin: 50% 85%;
  }
  .cursor-glyph.cursor-arrow{
    animation: cursorPulse 1.5s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  @keyframes cursorSway{
    0%,100%{ transform:rotate(0deg) scale(1); }
    30%{ transform:rotate(-3deg) scale(0.97); }
    60%{ transform:rotate(2deg) scale(1.03); }
  }
  @keyframes cursorPulse{
    0%,100%{ transform:scale(1); opacity:0.9; }
    50%{ transform:scale(1.12); opacity:1; }
  }

  #exitZone{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:5;
  }

  .hint{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:4;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    color:#dce8ff;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    transition: opacity 0.3s ease;
    pointer-events:none;
    text-shadow: 0 0 6px rgba(180,200,255,0.6);
  }
  #exitZone:hover ~ .hint,
  .hint.show{
    opacity:0.85;
  }

  /* ===== hotbar (shows while the lights are off) ===== */
  #hotbar{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:none;
    gap:7px;
    z-index:10000;
    padding:7px;
    background: rgba(10,6,4,0.55);
    border-radius:8px;
    box-shadow: 0 0 18px rgba(0,0,0,0.6);
    pointer-events:auto;
  }
  body.lights-off #hotbar{ display:flex; }
  .hotbar-slot{
    width:44px;
    height:44px;
    border:2px solid rgba(201,184,232,0.35);
    border-radius:6px;
    background: linear-gradient(160deg, rgba(50,36,26,0.9), rgba(14,9,7,0.92));
    position:relative;
  }

<div class="dim"></div>
<div class="moonlight"></div>
<div class="cauldron-mist"><span class="mist-puff mist-1"></span><span class="mist-puff mist-2"></span><span class="mist-puff mist-3"></span></div>
<div id="candleCursor">
  <div class="cursor-glyph" id="cursorGlyph">🕯️</div>
</div>

<div id="exitZone"></div>
<div id="cauldronHotspot"></div>
<div class="hint" id="exitHint">↓ leave ↓</div>

<script>
  (function(){
    var body = document.body;
    var candle = document.getElementById('candleCursor');
    var glyph = document.getElementById('cursorGlyph');
    var exitZone = document.getElementById('exitZone');
    var exitHint = document.getElementById('exitHint');
    var towerImg = document.getElementById('towerImg');
    var cauldronMist = document.querySelector('.cauldron-mist');

    // cauldron's fixed location within the source image, as a fraction of
    // the image itself (not the viewport) — measured on the actual artwork.
    var CAULDRON_X = 0.465;
    var CAULDRON_Y = 0.69;

    function positionMist(){
      if (!towerImg || !cauldronMist) return;
      var iw = towerImg.naturalWidth, ih = towerImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih;
      var vpAspect = vw / vh;
      var x, y;
      if (vpAspect > imgAspect) {
        // width-constrained cover: full width shown, vertical crop
        var scaledH = vw / imgAspect;
        var offsetY = (scaledH - vh) / 2;
        x = CAULDRON_X * vw;
        y = CAULDRON_Y * scaledH - offsetY;
      } else {
        // height-constrained cover: full height shown, horizontal crop
        var scaledW = vh * imgAspect;
        var offsetX = (scaledW - vw) / 2;
        x = CAULDRON_X * scaledW - offsetX;
        y = CAULDRON_Y * vh;
      }
      cauldronMist.style.left = x + 'px';
      cauldronMist.style.top = y + 'px';
    }
    if (towerImg) {
      if (towerImg.complete) positionMist();
      towerImg.addEventListener('load', positionMist);
    }
    window.addEventListener('resize', positionMist);

    function moveCandle(x, y){
      candle.style.left = x + 'px';
      candle.style.top = y + 'px';
    }
    document.addEventListener('mousemove', function(e){ moveCandle(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function(e){
      if (e.touches && e.touches[0]) moveCandle(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    exitZone.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '⬇️';
      glyph.classList.add('cursor-arrow');
      exitHint.classList.add('show');
    });
    exitZone.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
      exitHint.classList.remove('show');
    });
    exitZone.addEventListener('click', function(){
      window.location.href = 'hallway-halloween.html';
    });

    // --- cauldron: replaces the normal soundtrack while on this page ---
    // (the regular playlist's background clock keeps ticking via localStorage, so the
    // soundtrack picks back up in sync once the visitor leaves this page)
    // the wolf howl plays once before the cauldron loop, but only the first time this
    // page is visited during the current game — "riponeGame..." keys are wiped whenever
    // the lights are toggled, so this naturally resets along with everything else
    var TOWER_VISITED_KEY = 'riponeGameTowerVisited';
    var cauldronAudio = new Audio('audio/cauldron.mp3');
    cauldronAudio.loop = true;
    var wolfHowlAudio = new Audio('audio/wolf-howl.mp3');
    var towerResumeArmed = false;
    function armTowerResume(retryFn){
      if (towerResumeArmed) return;
      towerResumeArmed = true;
      function tryResume(){
        document.removeEventListener('click', tryResume);
        document.removeEventListener('touchstart', tryResume);
        document.removeEventListener('keydown', tryResume);
        towerResumeArmed = false;
        retryFn();
      }
      document.addEventListener('click', tryResume, { once:true });
      document.addEventListener('touchstart', tryResume, { once:true, passive:true });
      document.addEventListener('keydown', tryResume, { once:true });
    }
    function playCauldronLoop(){
      cauldronAudio.play().catch(function(){ armTowerResume(playCauldronLoop); });
    }
    var alreadyVisitedTower = false;
    try { alreadyVisitedTower = localStorage.getItem(TOWER_VISITED_KEY) === '1'; } catch(e){}
    try { localStorage.setItem(TOWER_VISITED_KEY, '1'); } catch(e){}
    if (alreadyVisitedTower) {
      playCauldronLoop();
    } else {
      wolfHowlAudio.addEventListener('ended', playCauldronLoop);
      (function playHowl(){
        wolfHowlAudio.play().catch(function(){ armTowerResume(playHowl); });
      })();
    }

    // --- cauldron hotspot: brew a potion from stick + ash + eye, or just poof ---
    var cauldronHotspot = document.getElementById('cauldronHotspot');
    var CAULDRON_HOTSPOT_W = 0.24, CAULDRON_HOTSPOT_H = 0.28;
    function positionCauldronHotspot(){
      if (!towerImg) return;
      var iw = towerImg.naturalWidth, ih = towerImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih, vpAspect = vw / vh;
      var scaledW, scaledH, offsetX = 0, offsetY = 0;
      if (vpAspect > imgAspect) {
        scaledW = vw; scaledH = vw / imgAspect; offsetY = (scaledH - vh) / 2;
      } else {
        scaledH = vh; scaledW = vh * imgAspect; offsetX = (scaledW - vw) / 2;
      }
      var left = (CAULDRON_X - CAULDRON_HOTSPOT_W/2) * scaledW - offsetX;
      var top = (CAULDRON_Y - CAULDRON_HOTSPOT_H/2) * scaledH - offsetY;
      cauldronHotspot.style.left = left + 'px';
      cauldronHotspot.style.top = top + 'px';
      cauldronHotspot.style.width = (CAULDRON_HOTSPOT_W * scaledW) + 'px';
      cauldronHotspot.style.height = (CAULDRON_HOTSPOT_H * scaledH) + 'px';
    }
    if (towerImg) {
      if (towerImg.complete) positionCauldronHotspot();
      towerImg.addEventListener('load', positionCauldronHotspot);
    }
    window.addEventListener('resize', positionCauldronHotspot);

    var CAULDRON_HOTBAR_KEY = 'riponeGameHotbar';
    function loadCauldronHotbarState(){
      try {
        var raw = localStorage.getItem(CAULDRON_HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function saveCauldronHotbarState(state){
      try { localStorage.setItem(CAULDRON_HOTBAR_KEY, JSON.stringify(state)); } catch(e){}
      if (window.riponeRenderHotbar) window.riponeRenderHotbar();
    }
    var fairyDustAudio = new Audio('audio/fairy-dust.mp3');
    var smokePoofAudio = new Audio('audio/smoke-poof.mp3');
    cauldronHotspot.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '👆';
      glyph.classList.add('cursor-arrow');
    });
    cauldronHotspot.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
    });
    cauldronHotspot.addEventListener('click', function(e){
      e.stopPropagation();
      var state = loadCauldronHotbarState();
      var hasStick = state.items.indexOf('stick') !== -1;
      var hasAsh = state.items.indexOf('ash') !== -1;
      var hasEye = state.items.indexOf('eye') !== -1;
      if (hasStick && hasAsh && hasEye) {
        ['stick', 'ash', 'eye'].forEach(function(it){
          var idx = state.items.indexOf(it);
          if (idx !== -1) state.items[idx] = null;
        });
        state.items[0] = 'potion';
        saveCauldronHotbarState(state);
        fairyDustAudio.currentTime = 0;
        fairyDustAudio.play().catch(function(){});
      } else {
        smokePoofAudio.currentTime = 0;
        smokePoofAudio.play().catch(function(){});
      }
    });

    try { localStorage.setItem('riponeLightsOff', '1'); } catch(e){}
  })();
</script>

<div id="hotbar">
  <div class="hotbar-slot" data-slot="1"></div>
  <div class="hotbar-slot" data-slot="2"></div>
  <div class="hotbar-slot" data-slot="3"></div>
  <div class="hotbar-slot" data-slot="4"></div>
  <div class="hotbar-slot" data-slot="5"></div>
  <div class="hotbar-slot" data-slot="6"></div>
  <div class="hotbar-slot" data-slot="7"></div>
</div>
<script>
  (function(){
    document.body.classList.add('lights-off');
    var HOTBAR_KEY = 'riponeGameHotbar';
    var slots = Array.prototype.slice.call(document.querySelectorAll('#hotbar .hotbar-slot'));
    function loadHotbarState(){
      try {
        var raw = localStorage.getItem(HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function renderHotbar(){
      var state = loadHotbarState();
      slots.forEach(function(slot, i){
        var existing = slot.querySelector('.hotbar-item');
        if (existing) existing.remove();
        var item = state.items[i];
        var ITEM_ICON_CLASS = { ash: 'item-ash', stick: 'item-stick', paint: 'item-paint', eye: 'item-eye', potion: 'item-potion', key: 'item-key' };
        if (item && ITEM_ICON_CLASS[item]) {
          var el = document.createElement('div');
          el.className = 'hotbar-item ' + ITEM_ICON_CLASS[item];
          slot.appendChild(el);
        }
      });
    }
    renderHotbar();
    window.riponeRenderHotbar = renderHotbar;
    window.addEventListener('storage', function(e){
      if (e.key === HOTBAR_KEY) renderHotbar();
    });
  })();
</script>

</body>
