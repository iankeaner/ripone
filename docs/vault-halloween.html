<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 RIPONE.COM — ???</title>
<style>
  * { box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
  }

  .hallway-img{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  .dim{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.75) 100%);
    z-index:1;
    pointer-events:none;
  }

  body, body *{ cursor:none !important; }

  #lightsOverlay{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at var(--mx,50%) var(--my,50%),
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) var(--r-inner,55px),
      rgba(4,2,8,0.55) var(--r-mid,120px),
      rgba(2,1,5,0.88) var(--r-outer,220px),
      rgba(1,0,3,0.98) var(--r-far,340px)
    );
    z-index:9998;
    pointer-events:none;
    transition: background 90ms linear;
  }

  #candleCursor{
    position:fixed;
    top:50%; left:50%;
    z-index:9999;
    pointer-events:none;
    transform:translate(-50%,-72%);
  }
  #candleCursor.mode-arrow{
    transform:translate(-50%,-50%);
  }

  .cursor-glyph{
    font-size:30px;
    line-height:1;
    filter:
      drop-shadow(0 0 6px #ffcf7a)
      drop-shadow(0 0 16px #ff9d2f)
      drop-shadow(0 0 34px #ff7518);
    animation: candleFlicker 2.4s infinite;
    transform-origin: 50% 85%;
  }
  .cursor-glyph.cursor-arrow{
    animation: arrowGlow 1.5s ease-in-out infinite;
  }

  @keyframes candleFlicker{
    0%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    4%{ transform:rotate(-3deg) scale(0.96); filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 10px #ff9d2f) drop-shadow(0 0 20px #ff7518); }
    8%{ transform:rotate(2deg) scale(1.04); filter: drop-shadow(0 0 8px #ffcf7a) drop-shadow(0 0 20px #ff9d2f) drop-shadow(0 0 44px #ff7518); }
    13%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    30%{ transform:rotate(-2deg) scale(0.98); filter: drop-shadow(0 0 5px #ffcf7a) drop-shadow(0 0 13px #ff9d2f) drop-shadow(0 0 26px #ff7518); }
    34%{ transform:rotate(1deg) scale(1.06); filter: drop-shadow(0 0 9px #ffcf7a) drop-shadow(0 0 24px #ff9d2f) drop-shadow(0 0 50px #ff7518); }
    38%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    55%{ transform:rotate(3deg) scale(0.94); filter: drop-shadow(0 0 3px #ffcf7a) drop-shadow(0 0 8px #ff9d2f) drop-shadow(0 0 16px #ff7518); }
    60%{ transform:rotate(-1deg) scale(1.03); filter: drop-shadow(0 0 7px #ffcf7a) drop-shadow(0 0 18px #ff9d2f) drop-shadow(0 0 38px #ff7518); }
    65%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    80%{ transform:rotate(-2deg) scale(1.02); filter: drop-shadow(0 0 8px #ffcf7a) drop-shadow(0 0 20px #ff9d2f) drop-shadow(0 0 42px #ff7518); }
    85%{ transform:rotate(2deg) scale(0.95); filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 10px #ff9d2f) drop-shadow(0 0 20px #ff7518); }
    100%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
  }
  @keyframes arrowGlow{
    0%,100%{ filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); transform:scale(1); }
    50%{ filter: drop-shadow(0 0 10px #ffcf7a) drop-shadow(0 0 26px #ff9d2f) drop-shadow(0 0 50px #ff7518); transform:scale(1.1); }
  }

  #exitZone{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:5;
  }

  .hint{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:4;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    color:#c9b8e8;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    transition: opacity 0.3s ease;
    pointer-events:none;
    text-shadow: 0 0 6px rgba(176,38,255,0.6);
  }
  #exitZone:hover ~ .hint,
  .hint.show{
    opacity:0.85;
  }

  /* ===== hotbar (shows while the lights are off) ===== */
  #hotbar{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:none;
    gap:7px;
    z-index:10000;
    padding:7px;
    background: rgba(10,6,4,0.55);
    border-radius:8px;
    box-shadow: 0 0 18px rgba(0,0,0,0.6);
    pointer-events:auto;
  }
  body.lights-off #hotbar{ display:flex; }
  .hotbar-slot{
    width:44px;
    height:44px;
    border:2px solid rgba(201,184,232,0.35);
    border-radius:6px;
    background: linear-gradient(160deg, rgba(50,36,26,0.9), rgba(14,9,7,0.92));
    position:relative;
  }

<script>
  (function(){
    var body = document.body;
    var candle = document.getElementById('candleCursor');
    var glyph = document.getElementById('cursorGlyph');
    var exitZone = document.getElementById('exitZone');
    var exitHint = document.getElementById('exitHint');

    function moveCandle(x, y){
      body.style.setProperty('--mx', x + 'px');
      body.style.setProperty('--my', y + 'px');
      candle.style.left = x + 'px';
      candle.style.top = y + 'px';
    }
    document.addEventListener('mousemove', function(e){ moveCandle(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function(e){
      if (e.touches && e.touches[0]) moveCandle(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function jitterFlicker(){
      var innerJ = 45 + Math.random() * 22;
      var midJ = 100 + Math.random() * 45;
      var outerJ = 190 + Math.random() * 65;
      var farJ = 310 + Math.random() * 70;
      body.style.setProperty('--r-inner', innerJ + 'px');
      body.style.setProperty('--r-mid', midJ + 'px');
      body.style.setProperty('--r-outer', outerJ + 'px');
      body.style.setProperty('--r-far', farJ + 'px');
    }
    setInterval(jitterFlicker, 160);
    jitterFlicker();

    exitZone.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '⬇️';
      glyph.classList.add('cursor-arrow');
      exitHint.classList.add('show');
    });
    exitZone.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
      exitHint.classList.remove('show');
    });
    exitZone.addEventListener('click', function(){
      window.location.href = 'cemetery-halloween.html';
    });

    // --- replace the soundtrack with the vault ambience, looping ---
    var vaultAmbienceAudio = new Audio('audio/barren-dungeon.mp3');
    vaultAmbienceAudio.loop = true;
    var vaultResumeArmed = false;
    var vaultAudioMuted = false;
    function armVaultResume(){
      if (vaultResumeArmed) return;
      vaultResumeArmed = true;
      function tryResume(){
        document.removeEventListener('click', tryResume);
        document.removeEventListener('touchstart', tryResume);
        document.removeEventListener('keydown', tryResume);
        vaultResumeArmed = false;
        if (vaultAudioMuted) return;
        vaultAmbienceAudio.play().catch(function(){ armVaultResume(); });
      }
      document.addEventListener('click', tryResume, { once:true });
      document.addEventListener('touchstart', tryResume, { once:true, passive:true });
      document.addEventListener('keydown', tryResume, { once:true });
    }
    vaultAmbienceAudio.play().catch(function(){ armVaultResume(); });

    function setVaultAudioMuted(muted){
      vaultAudioMuted = muted;
      if (muted) {
        vaultAmbienceAudio.pause();
      } else {
        vaultAmbienceAudio.play().catch(function(){ armVaultResume(); });
      }
    }

    // --- little AC unit in the bottom right corner: click to mute/unmute the vault ambience ---
    var roomImg = document.querySelector('.hallway-img');
    var acUnitHotspot = document.getElementById('acUnitHotspot');
    var AC_X = 0.901, AC_Y = 0.861, AC_W = 0.10, AC_H = 0.26;
    function positionAcUnitHotspot(){
      var iw = roomImg.naturalWidth, ih = roomImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih, vpAspect = vw / vh;
      var scaledW, scaledH, offsetX = 0, offsetY = 0;
      if (vpAspect > imgAspect) {
        scaledW = vw; scaledH = vw / imgAspect; offsetY = (scaledH - vh) / 2;
      } else {
        scaledH = vh; scaledW = vh * imgAspect; offsetX = (scaledW - vw) / 2;
      }
      var left = (AC_X - AC_W/2) * scaledW - offsetX;
      var top = (AC_Y - AC_H/2) * scaledH - offsetY;
      acUnitHotspot.style.left = left + 'px';
      acUnitHotspot.style.top = top + 'px';
      acUnitHotspot.style.width = (AC_W * scaledW) + 'px';
      acUnitHotspot.style.height = (AC_H * scaledH) + 'px';
    }
    if (roomImg.complete) positionAcUnitHotspot();
    roomImg.addEventListener('load', positionAcUnitHotspot);
    window.addEventListener('resize', positionAcUnitHotspot);

    acUnitHotspot.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '👆';
      glyph.classList.add('cursor-arrow');
    });
    acUnitHotspot.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
    });
    acUnitHotspot.addEventListener('click', function(e){
      e.stopPropagation();
      setVaultAudioMuted(!vaultAudioMuted);
    });

    // --- fireplace: click for a flavor message ---
    var fireplaceHotspot = document.getElementById('fireplaceHotspot');
    var fireplaceSpeech = document.getElementById('fireplaceSpeech');
    var fireplaceSpeechText = document.getElementById('fireplaceSpeechText');
    var FIREPLACE_X = 0.62, FIREPLACE_Y = 0.565, FIREPLACE_W = 0.24, FIREPLACE_H = 0.32;
    function positionFireplaceHotspot(){
      var iw = roomImg.naturalWidth, ih = roomImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih, vpAspect = vw / vh;
      var scaledW, scaledH, offsetX = 0, offsetY = 0;
      if (vpAspect > imgAspect) {
        scaledW = vw; scaledH = vw / imgAspect; offsetY = (scaledH - vh) / 2;
      } else {
        scaledH = vh; scaledW = vh * imgAspect; offsetX = (scaledW - vw) / 2;
      }
      var left = (FIREPLACE_X - FIREPLACE_W/2) * scaledW - offsetX;
      var top = (FIREPLACE_Y - FIREPLACE_H/2) * scaledH - offsetY;
      fireplaceHotspot.style.left = left + 'px';
      fireplaceHotspot.style.top = top + 'px';
      fireplaceHotspot.style.width = (FIREPLACE_W * scaledW) + 'px';
      fireplaceHotspot.style.height = (FIREPLACE_H * scaledH) + 'px';
    }
    if (roomImg.complete) positionFireplaceHotspot();
    roomImg.addEventListener('load', positionFireplaceHotspot);
    window.addEventListener('resize', positionFireplaceHotspot);

    var fireplaceMessageTimer = null;
    function clearFireplaceMessageTimer(){
      if (fireplaceMessageTimer) { clearTimeout(fireplaceMessageTimer); fireplaceMessageTimer = null; }
    }
    function showFireplaceMessage(text){
      clearFireplaceMessageTimer();
      fireplaceSpeechText.textContent = text;
      fireplaceMessageTimer = setTimeout(function(){
        fireplaceSpeech.classList.remove('show');
      }, 3000);
    }
    fireplaceHotspot.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '🔍';
      glyph.classList.add('cursor-arrow');
    });
    fireplaceHotspot.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
    });
    fireplaceHotspot.addEventListener('click', function(e){
      e.stopPropagation();
      showFireplaceMessage("There's literally nothing here.");
      fireplaceSpeech.classList.remove('show');
      void fireplaceSpeech.offsetWidth; // restart the fade-in even if it's already showing
      fireplaceSpeech.classList.add('show');
    });

    // --- black paint can on the bench: click once to pick it up ---
    var paintCanHotspot = document.getElementById('paintCanHotspot');
    var paintCanSpeech = document.getElementById('paintCanSpeech');
    var paintCanSpeechText = document.getElementById('paintCanSpeechText');
    var PAINTCAN_X = 0.2188, PAINTCAN_Y = 0.5764, PAINTCAN_W = 0.055, PAINTCAN_H = 0.11;
    function positionPaintCanHotspot(){
      var iw = roomImg.naturalWidth, ih = roomImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih, vpAspect = vw / vh;
      var scaledW, scaledH, offsetX = 0, offsetY = 0;
      if (vpAspect > imgAspect) {
        scaledW = vw; scaledH = vw / imgAspect; offsetY = (scaledH - vh) / 2;
      } else {
        scaledH = vh; scaledW = vh * imgAspect; offsetX = (scaledW - vw) / 2;
      }
      var left = (PAINTCAN_X - PAINTCAN_W/2) * scaledW - offsetX;
      var top = (PAINTCAN_Y - PAINTCAN_H/2) * scaledH - offsetY;
      paintCanHotspot.style.left = left + 'px';
      paintCanHotspot.style.top = top + 'px';
      paintCanHotspot.style.width = (PAINTCAN_W * scaledW) + 'px';
      paintCanHotspot.style.height = (PAINTCAN_H * scaledH) + 'px';
    }
    if (roomImg.complete) positionPaintCanHotspot();
    roomImg.addEventListener('load', positionPaintCanHotspot);
    window.addEventListener('resize', positionPaintCanHotspot);

    // --- patch that covers the can (and its shadow) once it's been picked up ---
    var paintCanPatch = document.getElementById('paintCanPatch');
    var PATCH_X = 0.21875, PATCH_Y = 0.56713, PATCH_W = 0.05729, PATCH_H = 0.11574;
    function positionPaintCanPatch(){
      var iw = roomImg.naturalWidth, ih = roomImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih, vpAspect = vw / vh;
      var scaledW, scaledH, offsetX = 0, offsetY = 0;
      if (vpAspect > imgAspect) {
        scaledW = vw; scaledH = vw / imgAspect; offsetY = (scaledH - vh) / 2;
      } else {
        scaledH = vh; scaledW = vh * imgAspect; offsetX = (scaledW - vw) / 2;
      }
      var left = (PATCH_X - PATCH_W/2) * scaledW - offsetX;
      var top = (PATCH_Y - PATCH_H/2) * scaledH - offsetY;
      paintCanPatch.style.left = left + 'px';
      paintCanPatch.style.top = top + 'px';
      paintCanPatch.style.width = (PATCH_W * scaledW) + 'px';
      paintCanPatch.style.height = (PATCH_H * scaledH) + 'px';
    }
    if (roomImg.complete) positionPaintCanPatch();
    roomImg.addEventListener('load', positionPaintCanPatch);
    window.addEventListener('resize', positionPaintCanPatch);

    var PAINT_HOTBAR_KEY = 'riponeGameHotbar';
    function loadPaintHotbarState(){
      try {
        var raw = localStorage.getItem(PAINT_HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function paintCanAlreadyTaken(){
      return loadPaintHotbarState().items.indexOf('paint') !== -1;
    }
    if (paintCanAlreadyTaken()) {
      paintCanPatch.style.transition = 'none';
      paintCanPatch.style.opacity = '1';
    }
    function collectPaintCan(){
      var state = loadPaintHotbarState();
      var idx = state.items.indexOf(null);
      if (idx === -1) return false;
      state.items[idx] = 'paint';
      try { localStorage.setItem(PAINT_HOTBAR_KEY, JSON.stringify(state)); } catch(e){}
      if (window.riponeRenderHotbar) window.riponeRenderHotbar();
      return true;
    }
    var paintCanMessageTimer = null;
    function clearPaintCanMessageTimer(){
      if (paintCanMessageTimer) { clearTimeout(paintCanMessageTimer); paintCanMessageTimer = null; }
    }
    function showPaintCanMessage(text){
      clearPaintCanMessageTimer();
      paintCanSpeechText.textContent = text;
      paintCanSpeech.classList.remove('show');
      void paintCanSpeech.offsetWidth; // restart the fade-in even if it's already showing
      paintCanSpeech.classList.add('show');
      paintCanMessageTimer = setTimeout(function(){
        paintCanSpeech.classList.remove('show');
      }, 3000);
    }
    function resetPaintCanCursor(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
    }
    paintCanHotspot.addEventListener('mouseenter', function(){
      if (paintCanAlreadyTaken()) return;
      candle.classList.add('mode-arrow');
      glyph.textContent = '👆';
      glyph.classList.add('cursor-arrow');
    });
    paintCanHotspot.addEventListener('mouseleave', function(){
      if (paintCanAlreadyTaken()) return;
      resetPaintCanCursor();
    });
    paintCanHotspot.addEventListener('click', function(e){
      e.stopPropagation();
      if (paintCanAlreadyTaken()) return;
      collectPaintCan();
      showPaintCanMessage("It's black paint.");
      resetPaintCanCursor();
      paintCanPatch.style.transition = 'none';
      paintCanPatch.style.opacity = '1';
    });

    try { localStorage.setItem('riponeLightsOff', '1'); } catch(e){}
  })();
</script>

<div id="hotbar">
  <div class="hotbar-slot" data-slot="1"></div>
  <div class="hotbar-slot" data-slot="2"></div>
  <div class="hotbar-slot" data-slot="3"></div>
  <div class="hotbar-slot" data-slot="4"></div>
  <div class="hotbar-slot" data-slot="5"></div>
  <div class="hotbar-slot" data-slot="6"></div>
  <div class="hotbar-slot" data-slot="7"></div>
</div>
<script>
  (function(){
    document.body.classList.add('lights-off');
    var HOTBAR_KEY = 'riponeGameHotbar';
    var slots = Array.prototype.slice.call(document.querySelectorAll('#hotbar .hotbar-slot'));
    function loadHotbarState(){
      try {
        var raw = localStorage.getItem(HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function renderHotbar(){
      var state = loadHotbarState();
      slots.forEach(function(slot, i){
        var existing = slot.querySelector('.hotbar-item');
        if (existing) existing.remove();
        var item = state.items[i];
        var ITEM_ICON_CLASS = { ash: 'item-ash', stick: 'item-stick', paint: 'item-paint', eye: 'item-eye', potion: 'item-potion', key: 'item-key' };
        if (item && ITEM_ICON_CLASS[item]) {
          var el = document.createElement('div');
          el.className = 'hotbar-item ' + ITEM_ICON_CLASS[item];
          slot.appendChild(el);
        }
      });
    }
    renderHotbar();
    window.riponeRenderHotbar = renderHotbar;
    window.addEventListener('storage', function(e){
      if (e.key === HOTBAR_KEY) renderHotbar();
    });
  })();
</script>

</body>
