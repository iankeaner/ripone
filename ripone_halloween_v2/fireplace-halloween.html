<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 RIPONE.COM — ???</title>
<style>
  * { box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
  }

  /* full-bleed: the image stretches/covers the entire viewport */
  .fire-img{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  /* base darkening, lighter than the candlelit pages since the fire itself
     is doing the illuminating here, not a localized candle glow */
  .dim{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.4) 55%, rgba(0,0,0,0.65) 100%);
    z-index:1;
    pointer-events:none;
  }

  /* the green fire washes the whole room in a faint, flickering glow —
     centered roughly where the flames sit in the image, not on the cursor */
  .fireglow{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    background: radial-gradient(circle at 50% 38%,
      rgba(140,255,160,0.55) 0%,
      rgba(110,255,140,0.30) 18%,
      rgba(90,230,120,0.16) 36%,
      rgba(60,200,100,0.06) 58%,
      rgba(0,0,0,0) 80%
    );
    mix-blend-mode: screen;
    animation: fireFlicker 3.2s ease-in-out infinite;
  }
  @keyframes fireFlicker{
    0%{ opacity:0.85; }
    9%{ opacity:0.6; }
    18%{ opacity:0.95; }
    27%{ opacity:0.68; }
    36%{ opacity:1; }
    45%{ opacity:0.72; }
    54%{ opacity:0.9; }
    63%{ opacity:0.6; }
    72%{ opacity:0.95; }
    81%{ opacity:0.7; }
    100%{ opacity:0.85; }
  }

  body, body *{ cursor:none !important; }

  #candleCursor{
    position:fixed;
    top:50%; left:50%;
    z-index:9999;
    pointer-events:none;
    transform:translate(-50%,-72%);
  }
  #candleCursor.mode-arrow{
    transform:translate(-50%,-50%);
  }

  /* no candle glow here — the green fire is the only light source on this page */
  .cursor-glyph{
    font-size:30px;
    line-height:1;
    animation: cursorSway 2.6s ease-in-out infinite;
    transform-origin: 50% 85%;
  }
  .cursor-glyph.cursor-arrow{
    animation: cursorPulse 1.5s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  @keyframes cursorSway{
    0%,100%{ transform:rotate(0deg) scale(1); }
    30%{ transform:rotate(-3deg) scale(0.97); }
    60%{ transform:rotate(2deg) scale(1.03); }
  }
  @keyframes cursorPulse{
    0%,100%{ transform:scale(1); opacity:0.9; }
    50%{ transform:scale(1.12); opacity:1; }
  }

  #exitZone{
    position:fixed;
    left:0; right:0; bottom:0;
    height:20vh;
    z-index:5;
  }

  .hint{
    position:fixed;
    left:0; right:0; bottom:0;
    height:20vh;
    z-index:4;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    color:#a8ffb8;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    transition: opacity 0.3s ease;
    pointer-events:none;
    text-shadow: 0 0 6px rgba(120,255,140,0.6);
  }
  #exitZone:hover ~ .hint,
  .hint.show{
    opacity:0.85;
  }

  /* ===== hotbar (shows while the lights are off) ===== */
  #hotbar{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:none;
    gap:7px;
    z-index:10000;
    padding:7px;
    background: rgba(10,6,4,0.55);
    border-radius:8px;
    box-shadow: 0 0 18px rgba(0,0,0,0.6);
    pointer-events:auto;
  }
  body.lights-off #hotbar{ display:flex; }
  .hotbar-slot{
    width:44px;
    height:44px;
    border:2px solid rgba(201,184,232,0.35);
    border-radius:6px;
    background: linear-gradient(160deg, rgba(50,36,26,0.9), rgba(14,9,7,0.92));
    position:relative;
  }

<div class="hint" id="exitHint">↓ leave ↓</div>

<script>
  (function(){
    var body = document.body;
    var candle = document.getElementById('candleCursor');
    var glyph = document.getElementById('cursorGlyph');
    var exitZone = document.getElementById('exitZone');
    var exitHint = document.getElementById('exitHint');

    function moveCandle(x, y){
      candle.style.left = x + 'px';
      candle.style.top = y + 'px';
    }
    document.addEventListener('mousemove', function(e){ moveCandle(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function(e){
      if (e.touches && e.touches[0]) moveCandle(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    exitZone.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '⬇️';
      glyph.classList.add('cursor-arrow');
      exitHint.classList.add('show');
    });
    exitZone.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
      exitHint.classList.remove('show');
    });
    exitZone.addEventListener('click', function(){
      window.location.href = 'lounge-halloween.html';
    });

    // --- fire hotspot: click once to pull a pile of ash from the embers ---
    var fireImg = document.querySelector('.fire-img');
    var fireHotspot = document.getElementById('fireHotspot');
    var FIRE_X = 0.515, FIRE_Y = 0.415, FIRE_W = 0.68, FIRE_H = 0.73;

    function positionFireHotspot(){
      var iw = fireImg.naturalWidth, ih = fireImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih, vpAspect = vw / vh;
      var scaledW, scaledH, offsetX = 0, offsetY = 0;
      if (vpAspect > imgAspect) {
        scaledW = vw; scaledH = vw / imgAspect; offsetY = (scaledH - vh) / 2;
      } else {
        scaledH = vh; scaledW = vh * imgAspect; offsetX = (scaledW - vw) / 2;
      }
      var left = (FIRE_X - FIRE_W/2) * scaledW - offsetX;
      var top = (FIRE_Y - FIRE_H/2) * scaledH - offsetY;
      fireHotspot.style.left = left + 'px';
      fireHotspot.style.top = top + 'px';
      fireHotspot.style.width = (FIRE_W * scaledW) + 'px';
      fireHotspot.style.height = (FIRE_H * scaledH) + 'px';
    }
    if (fireImg.complete) positionFireHotspot();
    fireImg.addEventListener('load', positionFireHotspot);
    window.addEventListener('resize', positionFireHotspot);

    var HOTBAR_KEY = 'riponeGameHotbar';
    function loadHotbarState(){
      try {
        var raw = localStorage.getItem(HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function ashAlreadyTaken(){
      return loadHotbarState().items.indexOf('ash') !== -1;
    }
    function collectAsh(){
      var state = loadHotbarState();
      var idx = state.items.indexOf(null);
      if (idx === -1) return false;
      state.items[idx] = 'ash';
      try { localStorage.setItem(HOTBAR_KEY, JSON.stringify(state)); } catch(e){}
      if (window.riponeRenderHotbar) window.riponeRenderHotbar();
      return true;
    }
    function resetFireCursor(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
    }
    fireHotspot.addEventListener('mouseenter', function(){
      if (ashAlreadyTaken()) return;
      candle.classList.add('mode-arrow');
      glyph.textContent = '👆';
      glyph.classList.add('cursor-arrow');
    });
    fireHotspot.addEventListener('mouseleave', function(){
      if (ashAlreadyTaken()) return;
      resetFireCursor();
    });
    fireHotspot.addEventListener('click', function(){
      if (ashAlreadyTaken()) return;
      collectAsh();
      resetFireCursor();
    });

    // --- fireplace crackle: plays instead of the normal soundtrack while on this page ---
    // (the regular playlist's background clock keeps ticking via localStorage, so the
    // soundtrack picks back up in sync once the visitor leaves this page)
    var crackleAudio = new Audio('audio/fireplace-crackle.mp3');
    crackleAudio.loop = true;
    var crackleResumeArmed = false;
    function armCrackleResume(){
      if (crackleResumeArmed) return;
      crackleResumeArmed = true;
      function tryResume(){
        document.removeEventListener('click', tryResume);
        document.removeEventListener('touchstart', tryResume);
        document.removeEventListener('keydown', tryResume);
        crackleResumeArmed = false;
        crackleAudio.play().catch(function(){ armCrackleResume(); });
      }
      document.addEventListener('click', tryResume, { once:true });
      document.addEventListener('touchstart', tryResume, { once:true, passive:true });
      document.addEventListener('keydown', tryResume, { once:true });
    }
    crackleAudio.play().catch(function(){ armCrackleResume(); });

    try { localStorage.setItem('riponeLightsOff', '1'); } catch(e){}
  })();
</script>

<div id="hotbar">
  <div class="hotbar-slot" data-slot="1"></div>
  <div class="hotbar-slot" data-slot="2"></div>
  <div class="hotbar-slot" data-slot="3"></div>
  <div class="hotbar-slot" data-slot="4"></div>
  <div class="hotbar-slot" data-slot="5"></div>
  <div class="hotbar-slot" data-slot="6"></div>
  <div class="hotbar-slot" data-slot="7"></div>
</div>
<script>
  (function(){
    document.body.classList.add('lights-off');
    var HOTBAR_KEY = 'riponeGameHotbar';
    var slots = Array.prototype.slice.call(document.querySelectorAll('#hotbar .hotbar-slot'));
    function loadHotbarState(){
      try {
        var raw = localStorage.getItem(HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function renderHotbar(){
      var state = loadHotbarState();
      slots.forEach(function(slot, i){
        var existing = slot.querySelector('.hotbar-item');
        if (existing) existing.remove();
        var item = state.items[i];
        var ITEM_ICON_CLASS = { ash: 'item-ash', stick: 'item-stick', paint: 'item-paint', eye: 'item-eye', potion: 'item-potion', key: 'item-key' };
        if (item && ITEM_ICON_CLASS[item]) {
          var el = document.createElement('div');
          el.className = 'hotbar-item ' + ITEM_ICON_CLASS[item];
          slot.appendChild(el);
        }
      });
    }
    renderHotbar();
    window.riponeRenderHotbar = renderHotbar;
    window.addEventListener('storage', function(e){
      if (e.key === HOTBAR_KEY) renderHotbar();
    });
  })();
</script>
