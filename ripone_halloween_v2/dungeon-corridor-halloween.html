<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 RIPONE.COM — ???</title>
<style>
  * { box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
  }

  .hallway-img{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:block;
  }

  .dim{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.75) 100%);
    z-index:1;
    pointer-events:none;
  }

  body, body *{ cursor:none !important; }

  #lightsOverlay{
    position:fixed;
    inset:0;
    background: radial-gradient(circle at var(--mx,50%) var(--my,50%),
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) var(--r-inner,55px),
      rgba(4,2,8,0.55) var(--r-mid,120px),
      rgba(2,1,5,0.88) var(--r-outer,220px),
      rgba(1,0,3,0.98) var(--r-far,340px)
    );
    z-index:9998;
    pointer-events:none;
    transition: background 90ms linear;
  }

  #candleCursor{
    position:fixed;
    top:50%; left:50%;
    z-index:9999;
    pointer-events:none;
    transform:translate(-50%,-72%);
  }
  #candleCursor.mode-arrow{
    transform:translate(-50%,-50%);
  }

  .cursor-glyph{
    font-size:30px;
    line-height:1;
    filter:
      drop-shadow(0 0 6px #ffcf7a)
      drop-shadow(0 0 16px #ff9d2f)
      drop-shadow(0 0 34px #ff7518);
    animation: candleFlicker 2.4s infinite;
    transform-origin: 50% 85%;
  }
  .cursor-glyph.cursor-arrow{
    animation: arrowGlow 1.5s ease-in-out infinite;
  }

  @keyframes candleFlicker{
    0%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    4%{ transform:rotate(-3deg) scale(0.96); filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 10px #ff9d2f) drop-shadow(0 0 20px #ff7518); }
    8%{ transform:rotate(2deg) scale(1.04); filter: drop-shadow(0 0 8px #ffcf7a) drop-shadow(0 0 20px #ff9d2f) drop-shadow(0 0 44px #ff7518); }
    13%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    30%{ transform:rotate(-2deg) scale(0.98); filter: drop-shadow(0 0 5px #ffcf7a) drop-shadow(0 0 13px #ff9d2f) drop-shadow(0 0 26px #ff7518); }
    34%{ transform:rotate(1deg) scale(1.06); filter: drop-shadow(0 0 9px #ffcf7a) drop-shadow(0 0 24px #ff9d2f) drop-shadow(0 0 50px #ff7518); }
    38%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    55%{ transform:rotate(3deg) scale(0.94); filter: drop-shadow(0 0 3px #ffcf7a) drop-shadow(0 0 8px #ff9d2f) drop-shadow(0 0 16px #ff7518); }
    60%{ transform:rotate(-1deg) scale(1.03); filter: drop-shadow(0 0 7px #ffcf7a) drop-shadow(0 0 18px #ff9d2f) drop-shadow(0 0 38px #ff7518); }
    65%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
    80%{ transform:rotate(-2deg) scale(1.02); filter: drop-shadow(0 0 8px #ffcf7a) drop-shadow(0 0 20px #ff9d2f) drop-shadow(0 0 42px #ff7518); }
    85%{ transform:rotate(2deg) scale(0.95); filter: drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 10px #ff9d2f) drop-shadow(0 0 20px #ff7518); }
    100%{ transform:rotate(0deg) scale(1); filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); }
  }
  @keyframes arrowGlow{
    0%,100%{ filter: drop-shadow(0 0 6px #ffcf7a) drop-shadow(0 0 16px #ff9d2f) drop-shadow(0 0 34px #ff7518); transform:scale(1); }
    50%{ filter: drop-shadow(0 0 10px #ffcf7a) drop-shadow(0 0 26px #ff9d2f) drop-shadow(0 0 50px #ff7518); transform:scale(1.1); }
  }

  #doorFadeOverlay{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:10000;
    transition: opacity 2s linear;
  }
  #doorFadeOverlay.door-fade-active{
    opacity:1;
  }

  #exitZone{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:5;
  }

  #farDoorHotspot{
    position:fixed;
    z-index:2;
    pointer-events:none;
  }

  .hint{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10vh;
    z-index:4;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    color:#c9b8e8;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    transition: opacity 0.3s ease;
    pointer-events:none;
    text-shadow: 0 0 6px rgba(176,38,255,0.6);
  }
  #exitZone:hover ~ .hint,
  .hint.show{
    opacity:0.85;
  }

  /* ===== hotbar (shows while the lights are off) ===== */
  #hotbar{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    display:none;
    gap:7px;
    z-index:10000;
    padding:7px;
    background: rgba(10,6,4,0.55);
    border-radius:8px;
    box-shadow: 0 0 18px rgba(0,0,0,0.6);
    pointer-events:auto;
  }
  body.lights-off #hotbar{ display:flex; }
  .hotbar-slot{
    width:44px;
    height:44px;
    border:2px solid rgba(201,184,232,0.35);
    border-radius:6px;
    background: linear-gradient(160deg, rgba(50,36,26,0.9), rgba(14,9,7,0.92));
    position:relative;
  }

<div class="dim"></div>
<div id="lightsOverlay"></div>
<div id="candleCursor">
  <div class="cursor-glyph" id="cursorGlyph">🕯️</div>
</div>
<div id="safeZoneIndicator"></div>
<div id="explosionOverlay"></div>

<div id="exitZone"></div>
<div id="farDoorHotspot"></div>
<div id="doorFadeOverlay"></div>
<div id="deathOverlay"><div id="deathText">YOU DIED</div></div>
<div class="hint" id="exitHint">↓ leave ↓</div>

<script>
  (function(){
    var body = document.body;
    var candle = document.getElementById('candleCursor');
    var glyph = document.getElementById('cursorGlyph');
    var exitZone = document.getElementById('exitZone');
    var doorFadeOverlay = document.getElementById('doorFadeOverlay');
    var doorCreakAudio = new Audio('audio/door-creak.mp3');
    var doorTransitionActive = false;
    function doorTransition(destination){
      if (doorTransitionActive) return;
      doorTransitionActive = true;
      try {
        doorCreakAudio.currentTime = 0;
        doorCreakAudio.play().catch(function(){});
      } catch(e){}
      doorFadeOverlay.classList.add('door-fade-active');
      setTimeout(function(){
        window.location.href = destination;
      }, 2000);
    }
    var exitHint = document.getElementById('exitHint');

    var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    function moveCandle(x, y){
      mouseX = x; mouseY = y;
      body.style.setProperty('--mx', x + 'px');
      body.style.setProperty('--my', y + 'px');
      candle.style.left = x + 'px';
      candle.style.top = y + 'px';
    }
    document.addEventListener('mousemove', function(e){ moveCandle(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function(e){
      if (e.touches && e.touches[0]) moveCandle(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function jitterFlicker(){
      var innerJ = 45 + Math.random() * 22;
      var midJ = 100 + Math.random() * 45;
      var outerJ = 190 + Math.random() * 65;
      var farJ = 310 + Math.random() * 70;
      body.style.setProperty('--r-inner', innerJ + 'px');
      body.style.setProperty('--r-mid', midJ + 'px');
      body.style.setProperty('--r-outer', outerJ + 'px');
      body.style.setProperty('--r-far', farJ + 'px');
    }
    setInterval(jitterFlicker, 160);
    jitterFlicker();

    exitZone.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '⬇️';
      glyph.classList.add('cursor-arrow');
      exitHint.classList.add('show');
    });
    exitZone.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
      exitHint.classList.remove('show');
    });
    exitZone.addEventListener('click', function(){
      window.location.href = 'dungeon-hallway-halloween.html';
    });

    var roomImg = document.getElementById('roomImg');

    try { localStorage.setItem('riponeLightsOff', '1'); } catch(e){}

    // --- door at the far end: only usable once the safe-zone mini-game has been beaten ---
    var farDoorHotspot = document.getElementById('farDoorHotspot');
    var FAR_DOOR_X = 0.645833, FAR_DOOR_Y = 0.481481, FAR_DOOR_W = 0.072917, FAR_DOOR_H = 0.166667;
    function positionFarDoorHotspot(){
      var iw = roomImg.naturalWidth, ih = roomImg.naturalHeight;
      if (!iw || !ih) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var imgAspect = iw / ih, vpAspect = vw / vh;
      var scaledW, scaledH, offsetX = 0, offsetY = 0;
      if (vpAspect > imgAspect) {
        scaledW = vw; scaledH = vw / imgAspect; offsetY = (scaledH - vh) / 2;
      } else {
        scaledH = vh; scaledW = vh * imgAspect; offsetX = (scaledW - vw) / 2;
      }
      var left = (FAR_DOOR_X - FAR_DOOR_W/2) * scaledW - offsetX;
      var top = (FAR_DOOR_Y - FAR_DOOR_H/2) * scaledH - offsetY;
      farDoorHotspot.style.left = left + 'px';
      farDoorHotspot.style.top = top + 'px';
      farDoorHotspot.style.width = (FAR_DOOR_W * scaledW) + 'px';
      farDoorHotspot.style.height = (FAR_DOOR_H * scaledH) + 'px';
    }
    if (roomImg.complete) positionFarDoorHotspot();
    roomImg.addEventListener('load', positionFarDoorHotspot);
    window.addEventListener('resize', positionFarDoorHotspot);

    farDoorHotspot.addEventListener('mouseenter', function(){
      candle.classList.add('mode-arrow');
      glyph.textContent = '👆';
      glyph.classList.add('cursor-arrow');
    });
    farDoorHotspot.addEventListener('mouseleave', function(){
      candle.classList.remove('mode-arrow');
      glyph.textContent = '🕯️';
      glyph.classList.remove('cursor-arrow');
    });
    farDoorHotspot.addEventListener('click', function(){
      window.location.href = 'dungeon-cellblock-halloween.html';
    });

    function enableFarDoorHotspot(){
      farDoorHotspot.style.pointerEvents = 'auto';
    }

    // --- safe-zone / explosion mini-game ---
    var CORRIDOR_MINIGAME_DONE_KEY = 'riponeGameDungeonCorridorMinigameDone';
    var corridorMinigameAlreadyDone = false;
    try { corridorMinigameAlreadyDone = localStorage.getItem(CORRIDOR_MINIGAME_DONE_KEY) === '1'; } catch(e){}

    var explosionMusicAudio = new Audio('audio/8bit-adventure.mp3');
    var explosionSfxAudio = new Audio('audio/explosion.mp3');

    function playAmbienceLoop(){
      var amb = new Audio('audio/barren-dungeon.mp3');
      amb.loop = true;
      var resumeArmed = false;
      function armResume(){
        if (resumeArmed) return;
        resumeArmed = true;
        function tryResume(){
          document.removeEventListener('click', tryResume);
          document.removeEventListener('touchstart', tryResume);
          document.removeEventListener('keydown', tryResume);
          resumeArmed = false;
          amb.play().catch(function(){ armResume(); });
        }
        document.addEventListener('click', tryResume, { once:true });
        document.addEventListener('touchstart', tryResume, { once:true, passive:true });
        document.addEventListener('keydown', tryResume, { once:true });
      }
      amb.play().catch(function(){ armResume(); });
    }

    if (corridorMinigameAlreadyDone) {
      // already survived this mini-game on a previous visit: just loop the vault ambience
      playAmbienceLoop();
      enableFarDoorHotspot();
    } else {
      var safeZoneIndicator = document.getElementById('safeZoneIndicator');
      var explosionOverlay = document.getElementById('explosionOverlay');
      var deathOverlay = document.getElementById('deathOverlay');
      function goToIndexAfterDeath(){
        // death only sends the player back — it doesn't wipe any game progress;
        // that only happens when the lights are toggled on the index page
        try { localStorage.setItem('riponeLightsOff', '1'); } catch(e){}
        window.location.href = 'index.html';
      }
      var deathNavTimeoutId = null;
      deathOverlay.addEventListener('click', function(){
        if (deathNavTimeoutId) clearTimeout(deathNavTimeoutId);
        goToIndexAfterDeath();
      });

      var GAME_DURATION = 90000;
      var DEMO_DURATION = 5000;
      var invincible = true;   // true during the 5-second example round
      var gameLive = false;    // true once the scored 90-second game has begun
      var roundActive = true;  // guards against overlapping cycles once the game ends
      var gameStartTime = 0;
      var cycleTimeoutId = null;

      function setExitLocked(locked){
        exitZone.style.pointerEvents = locked ? 'none' : '';
      }
      setExitLocked(true);

      function safeRadiusAt(t){ return 135 - t * 85; }       // 135px -> 50px: safe zone shrinks
      function reactionTimeAt(t){ return 2200 - t * 1300; }  // 2200ms -> 900ms: less time to react
      var EXPLOSION_DURATION = 650;

      function currentProgress(){
        if (!gameLive) return 0;
        var elapsed = performance.now() - gameStartTime;
        return Math.max(0, Math.min(1, elapsed / GAME_DURATION));
      }

      var firstCycle = true;
      function pickSafeZoneSpot(radius){
        var vw = window.innerWidth, vh = window.innerHeight;
        if (firstCycle) {
          firstCycle = false;
          return { x: vw / 2, y: (vh - 120) / 2 };
        }
        var margin = radius + 30;
        var x = margin + Math.random() * Math.max(10, vw - margin * 2);
        var y = margin + Math.random() * Math.max(10, (vh - 120) - margin * 2);
        return { x: x, y: y };
      }

      function showSafeZone(x, y, r){
        safeZoneIndicator.style.left = (x - r) + 'px';
        safeZoneIndicator.style.top = (y - r) + 'px';
        safeZoneIndicator.style.width = (r * 2) + 'px';
        safeZoneIndicator.style.height = (r * 2) + 'px';
        safeZoneIndicator.classList.add('show');
      }
      function hideSafeZone(){
        safeZoneIndicator.classList.remove('show');
      }

      function triggerExplosion(x, y, r, onResolve){
        var maskVal = 'radial-gradient(circle at ' + x + 'px ' + y + 'px, transparent 0, transparent ' + r + 'px, black ' + (r + 55) + 'px, black 100%)';
        explosionOverlay.style.maskImage = maskVal;
        explosionOverlay.style.webkitMaskImage = maskVal;
        explosionOverlay.classList.add('active');
        try {
          explosionSfxAudio.currentTime = 0;
          explosionSfxAudio.play().catch(function(){});
        } catch(e){}

        var checkStart = performance.now();
        var caught = false;
        function checkFrame(now){
          if (!roundActive) return;
          var dx = mouseX - x, dy = mouseY - y;
          if ((dx * dx + dy * dy) > r * r) caught = true;
          if (now - checkStart < EXPLOSION_DURATION) {
            requestAnimationFrame(checkFrame);
          } else {
            explosionOverlay.classList.remove('active');
            onResolve(caught);
          }
        }
        requestAnimationFrame(checkFrame);
      }

      function runCycle(){
        if (!roundActive) return;
        var t = currentProgress();
        var r = invincible ? safeRadiusAt(0) : safeRadiusAt(t);
        var reaction = invincible ? reactionTimeAt(0) : reactionTimeAt(t);
        var spot = pickSafeZoneSpot(r);

        showSafeZone(spot.x, spot.y, r);

        cycleTimeoutId = setTimeout(function(){
          if (!roundActive) return;
          hideSafeZone();
          triggerExplosion(spot.x, spot.y, r, function(caught){
            if (!roundActive) return;
            if (caught && !invincible) {
              loseGame();
              return;
            }
            if (gameLive && currentProgress() >= 1) {
              winGame();
              return;
            }
            runCycle();
          });
        }, reaction);
      }

      function winGame(){
        roundActive = false;
        gameLive = false;
        hideSafeZone();
        explosionOverlay.classList.remove('active');
        explosionMusicAudio.pause();
        setExitLocked(false);
        try { localStorage.setItem(CORRIDOR_MINIGAME_DONE_KEY, '1'); } catch(e){}
        playAmbienceLoop();
        enableFarDoorHotspot();
      }

      function loseGame(){
        roundActive = false;
        gameLive = false;
        hideSafeZone();
        explosionOverlay.classList.remove('active');
        explosionMusicAudio.pause();
        if (cycleTimeoutId) clearTimeout(cycleTimeoutId);
        deathOverlay.classList.add('active');
        deathNavTimeoutId = setTimeout(goToIndexAfterDeath, 6800);
      }

      // --- 5-second invincible example round, then the real game begins ---
      runCycle();
      setTimeout(function(){
        invincible = false;
        gameLive = true;
        gameStartTime = performance.now();
        try {
          explosionMusicAudio.currentTime = 0;
          explosionMusicAudio.play().catch(function(){});
        } catch(e){}
      }, DEMO_DURATION);
    }

    try { localStorage.setItem('riponeLightsOff', '1'); } catch(e){}
  })();
</script>

<div id="hotbar">
  <div class="hotbar-slot" data-slot="1"></div>
  <div class="hotbar-slot" data-slot="2"></div>
  <div class="hotbar-slot" data-slot="3"></div>
  <div class="hotbar-slot" data-slot="4"></div>
  <div class="hotbar-slot" data-slot="5"></div>
  <div class="hotbar-slot" data-slot="6"></div>
  <div class="hotbar-slot" data-slot="7"></div>
</div>
<script>
  (function(){
    document.body.classList.add('lights-off');
    var HOTBAR_KEY = 'riponeGameHotbar';
    var slots = Array.prototype.slice.call(document.querySelectorAll('#hotbar .hotbar-slot'));
    function loadHotbarState(){
      try {
        var raw = localStorage.getItem(HOTBAR_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.items)) return parsed;
        }
      } catch(e){}
      return { items: [null,null,null,null,null,null,null] };
    }
    function renderHotbar(){
      var state = loadHotbarState();
      slots.forEach(function(slot, i){
        var existing = slot.querySelector('.hotbar-item');
        if (existing) existing.remove();
        var item = state.items[i];
        var ITEM_ICON_CLASS = { ash: 'item-ash', stick: 'item-stick', paint: 'item-paint', eye: 'item-eye', potion: 'item-potion', key: 'item-key' };
        if (item && ITEM_ICON_CLASS[item]) {
          var el = document.createElement('div');
          el.className = 'hotbar-item ' + ITEM_ICON_CLASS[item];
          slot.appendChild(el);
        }
      });
    }
    renderHotbar();
    window.riponeRenderHotbar = renderHotbar;
    window.addEventListener('storage', function(e){
      if (e.key === HOTBAR_KEY) renderHotbar();
    });
  })();
</script>
